# opvane — AI agent operations dashboard
# JorahOne
#
# Self-contained Python HTTP server with HTML/JS frontend.
# Reads Hermes state from the host HERMES_HOME directory.

services:
  opvane:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/onebyjorah/opvane:latest
    container_name: opvane
    ports:
      - "127.0.0.1:${PORT:-51763}:${PORT:-51763}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-51763}
      - BIND=${BIND:-0.0.0.0}
      - MISSION_CONTROL_API_KEY=${MISSION_CONTROL_API_KEY:-}
      - HERMES_HOME=${HERMES_HOME:-/hermes-home}
      - MISSION_CONTROL_CONTENT_DIR=${MISSION_CONTROL_CONTENT_DIR:-/app/content}
    volumes:
      # Mount the host Hermes home for state/agent-logs access
      - ${HERMES_HOME:-~/.hermes}:/hermes-home:ro
      # Persistent board database
      - board-data:/app
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-51763}/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  board-data:
